<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <link rel="icon" href="./mark.svg" type="image/svg+xml">
    <title>Transport Atlas</title>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-adjust" viewBox="0 0 20 20"><path d="M3 6h7m4 0h3M3 14h3m4 0h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/></symbol>
      <symbol id="i-up" viewBox="0 0 20 20"><path d="m5.5 12.25 4.5-4.5 4.5 4.5"/></symbol>
      <symbol id="i-prev" viewBox="0 0 20 20"><path d="M16 10H4m5.5-5.5L4 10l5.5 5.5"/></symbol>
      <symbol id="i-next" viewBox="0 0 20 20"><path d="M4 10h12m-5.5-5.5L16 10l-5.5 5.5"/></symbol>
      <symbol id="i-pause" viewBox="0 0 20 20"><path d="M6.5 4.5v11m7-11v11" stroke-width="2.2"/></symbol>
      <symbol id="i-play" viewBox="0 0 20 20"><path d="m6 4 9 6-9 6Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-close" viewBox="0 0 20 20"><path d="m5 5 10 10m0-10L5 15"/></symbol>
    </svg>
    <header class="bar mast">
      <a class="brand" href="#lattice"><img src="./mark.svg" width="27" height="27" alt="">Transport Atlas</a>
      <div class="tools">
        <div class="views" role="group" aria-label="Camera view">
          <button id="chamber" aria-pressed="true">Chamber</button><button id="field" aria-pressed="false">Field</button>
        </div>
        <button class="tool" id="controls-open" popovertarget="controls" aria-label="Controls" title="Controls">
          <svg class="icon" aria-hidden="true"><use href="#i-adjust"/></svg><span>Controls</span>
        </button>
      </div>
    </header>

    <main class="stage" aria-labelledby="name">
      <canvas id="scene" aria-label="Interactive lighting chamber" aria-describedby="gesture"></canvas>
      <span id="live" class="sr-only" role="status">Initializing</span>
      <div id="error" role="alert" hidden></div>
    </main>

    <footer class="bar caption">
      <div class="study">
        <h1><button id="study-open" popovertarget="study-index" title="Choose a study">
          <span id="name">Lattice transport</span><svg class="icon chevron" aria-hidden="true"><use href="#i-up"/></svg>
        </button></h1>
        <div class="metadata"><span id="method"></span><span id="method-detail"></span></div>
      </div>
      <div class="playback">
        <button id="pause" class="icon-button" aria-label="Pause simulation" title="Pause simulation" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>
        </button>
        <nav class="paging" aria-label="Study navigation">
          <button id="prev" class="icon-button" aria-label="Previous study" title="Previous study"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
          <span class="count"><span id="number">01</span><span aria-hidden="true"> / </span><span id="total">24</span></span>
          <button id="next" class="icon-button" aria-label="Next study" title="Next study"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        </nav>
      </div>
    </footer>

    <div id="study-index" class="panel study-menu" popover="auto">
      <nav id="index" aria-label="Choose a study"></nav>
    </div>
    <section id="controls" class="panel controls" popover="auto" aria-labelledby="controls-title">
      <header class="panel-head"><h2 id="controls-title">Controls</h2>
        <button class="icon-button" popovertarget="controls" popovertargetaction="hide" aria-label="Close controls"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div id="sliders"></div>
      <div class="actions"><button id="action" class="primary"></button><button id="reset" class="quiet">Reset</button></div>
      <details id="notes"><summary>Field notes<svg class="icon chevron" aria-hidden="true"><use href="#i-up"/></svg></summary>
        <p id="diagnostic"></p><p id="summary"></p><p id="notes-text"></p><p id="gesture"></p>
      </details>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
